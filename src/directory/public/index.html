<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoT Building Dashboard</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1b1b1a; --ink2: #5a5955; --line: #e2e1dc;
    --accent: #2a78d6; --on: #1baf7a; --off: #9b9a95; --warn: #c2541d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121211; --card: #1a1a19; --ink: #f0efec; --ink2: #b9b8ae; --line: #2e2e2c; --accent: #3987e5; --on: #199e70; --off: #77766f; --warn: #e0703f; }
  }
  :root[data-theme="dark"] { --bg: #121211; --card: #1a1a19; --ink: #f0efec; --ink2: #b9b8ae; --line: #2e2e2c; --accent: #3987e5; --on: #199e70; --off: #77766f; --warn: #e0703f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;
           padding: 16px 0 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .sub, header .updated { color: var(--ink2); font-size: 13px; }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .meta { color: var(--ink2); font-size: 12px; margin: 2px 0 10px; }
  .badge { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink2); }
  h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 12px 0 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row .k { color: var(--ink2); }
  .row .v { text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .cols { display: grid; gap: 0 32px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button, select, input { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=number] { width: 72px; }
  .log { margin-top: 10px; font-size: 12px; color: var(--ink2); max-height: 112px; overflow: auto; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 0; }
  .log time { font-family: var(--mono); margin-right: 8px; }
  .alert { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--warn); font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  .table-wrap { overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--line); }
  td.id { font-family: var(--mono); word-break: break-all; }
  th { color: var(--ink2); font-weight: 600; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>WoT Smart-Building Gateway</h1>
    <div class="sub" id="summary">loading…</div>
  </div>
  <div class="updated" id="updated"></div>
</header>
<main id="cards"></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const UNITS = { "degree Celsius": "°C", percent: "%", watt: "W" };
const ACTION_LABELS = { turnOn: "Turn on", turnOff: "Turn off", toggle: "Toggle" };
const state = { sockets: {}, built: "" };
const clock = (t) => new Date(t).toLocaleTimeString();
const PROTO = { http: "HTTP", coap: "CoAP", mqtt: "MQTT", ws: "WS" };
const protoName = (p) => PROTO[p] || p.toUpperCase();

function form(aff, op, scheme = "http") {
  return (aff.forms || []).find((f) => [].concat(f.op || []).includes(op) && String(f.href).startsWith(scheme));
}
function protocols(td) {
  const s = new Set();
  for (const g of ["properties", "actions", "events"]) for (const a of Object.values(td[g] || {})) for (const f of a.forms || []) s.add(String(f.href).split(":")[0]);
  return [...s];
}
function fmt(v, unit) {
  if (typeof v === "boolean") return `<span class="dot" style="background:var(${v ? "--on" : "--off"})"></span>${v ? "On" : "Off"}`;
  if (typeof v === "number") return (Number.isInteger(v) ? v : v.toFixed(1)) + (unit ? " " + esc(unit) : "");
  if (v && typeof v === "object") return esc(JSON.stringify(v));
  return esc(v ?? "–");
}
function label(name, aff) {
  if (name === "on") return "State";
  return aff.title || name;
}
function eventText(data) {
  try {
    const d = JSON.parse(data);
    return Object.entries(d).filter(([k]) => !["ts", "seq", "simulated"].includes(k))
      .map(([k, v]) => (k === "on" ? `turned ${v ? "on" : "off"}`
        : `${k} ${typeof v === "boolean" ? (v ? "on" : "off") : typeof v === "number" ? +v.toFixed(1) : v}`)).join(", ");
  } catch (_) { return String(data); }
}

async function readProp(td, name) {
  const r = await fetch(form(td.properties[name], "readproperty").href);
  return r.json();
}
async function writeProp(td, name, value) {
  await fetch(form(td.properties[name], "writeproperty").href, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(value) });
}
async function invoke(td, name) {
  await fetch(form(td.actions[name], "invokeaction").href, { method: "POST", headers: { "Content-Type": "application/json" } });
}

// ---------------------------------------------------------------- one card per device (gateway proxy)
function deviceCard(td, nativeTd) {
  const el = document.createElement("section");
  el.className = "card";
  el.dataset.id = td.id;
  const native = nativeTd ? protocols(nativeTd) : [];
  el.innerHTML = `
    <h2>${esc(td.title)} <span>${native.map((p) => `<span class="badge" title="native protocol">${esc(protoName(p))}</span>`).join(" ")}</span></h2>
    <div class="meta">Native ${esc(native.map(protoName).join("/"))} · via the gateway</div>
    ${Object.entries(td.properties || {}).map(([p, a]) => `<div class="row"><span class="k">${esc(label(p, a))}</span><span class="v" data-prop="${esc(p)}">…</span></div>`).join("")}
    ${Object.keys(td.actions || {}).length ? `<div class="actions">${Object.entries(td.actions).map(([a, act]) =>
      `<button data-action="${esc(a)}" title="${esc(act.title || a)}">${esc(ACTION_LABELS[a] || act.title || a)}</button>`).join("")}</div>` : ""}
    ${Object.keys(td.events || {}).length ? `<h3>Recent events</h3><div class="log" data-log><div>waiting…</div></div>` : ""}`;
  el.querySelectorAll("[data-action]").forEach((b) => b.addEventListener("click", () => invoke(td, b.dataset.action).then(() => refreshCard(td, el))));
  // events over the gateway's WebSocket interface
  for (const [name, ev] of Object.entries(td.events || {})) {
    const wsf = form(ev, "subscribeevent", "ws");
    if (!wsf) continue;
    const key = td.id + "|" + name;
    if (state.sockets[key]) state.sockets[key].close();
    const ws = new WebSocket(wsf.href);
    ws.binaryType = "arraybuffer"; // node-wot sends events as binary frames
    state.sockets[key] = ws;
    let first = true;
    ws.onmessage = (m) => {
      const log = $("[data-log]", el);
      if (!log) return;
      if (first) { log.innerHTML = ""; first = false; }
      const text = typeof m.data === "string" ? m.data : new TextDecoder().decode(m.data);
      const line = document.createElement("div");
      line.innerHTML = `<time>${clock(Date.now())}</time>${esc(eventText(text))}`;
      log.prepend(line);
      while (log.children.length > 20) log.lastChild.remove();
    };
  }
  return el;
}

async function refreshCard(td, el) {
  for (const [p, a] of Object.entries(td.properties || {})) {
    const cell = $(`[data-prop="${CSS.escape(p)}"]`, el);
    try { cell.innerHTML = fmt(await readProp(td, p), UNITS[a.unit] || a.unit); } catch (e) { cell.textContent = "unreachable"; }
  }
}

// ---------------------------------------------------------------- the application
function appCard(td) {
  const el = document.createElement("section");
  el.className = "card wide";
  el.dataset.id = td.id;
  el.innerHTML = `
    <h2>${esc(td.title)} <span class="badge">APPLICATION</span></h2>
    <div class="meta">Written only against Thing Descriptions. No protocol code.</div>
    <div class="cols">
      <div>
        <h3>Status</h3>
        <div class="row"><span class="k">Temperature</span><span class="v" data-s="temperature">…</span></div>
        <div class="row"><span class="k">Fan</span><span class="v" data-s="fanOn">…</span></div>
        <div class="row"><span class="k">Heater plug</span><span class="v" data-s="heaterOn">…</span></div>
        <div class="row"><span class="k">Fan reached via</span><span class="v" data-s="fanVia">…</span></div>
        <div class="row"><span class="k">Application</span><span class="v" data-s="state">…</span></div>
      </div>
      <div>
        <h3>Settings</h3>
        <div class="row"><span class="k">Threshold</span><span><input type="number" step="0.5" data-set="threshold" aria-label="threshold in °C"> °C</span></div>
        <div class="row"><span class="k">Automatic control</span><span><select data-set="enabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></span></div>
        <div class="row"><span class="k">Device access</span><span><select data-set="mode"><option value="gateway">Via gateway</option><option value="direct">Direct (native)</option></select></span></div>
      </div>
    </div>
    <div class="alert" data-s="alert" hidden></div>`;
  el.querySelectorAll("[data-set]").forEach((inp) =>
    inp.addEventListener("change", () => {
      const k = inp.dataset.set;
      const v = k === "threshold" ? Number(inp.value) : k === "enabled" ? inp.value === "true" : inp.value;
      writeProp(td, k, v);
    })
  );
  return el;
}

async function refreshApp(td, el) {
  try {
    const s = await readProp(td, "status");
    const set = (k, v) => ($(`[data-s="${k}"]`, el).innerHTML = v);
    set("temperature", s.temperature != null ? `${s.temperature.toFixed(1)} °C` : "–");
    set("fanOn", s.fanOn == null ? "–" : fmt(s.fanOn));
    set("heaterOn", s.heaterOn == null ? "–" : fmt(s.heaterOn));
    set("fanVia", esc((s.bound?.fan?.protocols || []).map(protoName).join(" + ") || "–"));
    set("state", esc(s.state === "running" ? "Running" : s.state));
    const alert = $('[data-s="alert"]', el);
    alert.hidden = !s.lastAlert;
    if (s.lastAlert) alert.textContent = `Last alert ${clock(s.lastAlert.ts)}: ${s.lastAlert.message}`;
    for (const k of ["threshold", "enabled", "mode"]) {
      const inp = $(`[data-set="${k}"]`, el);
      if (document.activeElement !== inp) inp.value = String(s.settings[k]);
    }
  } catch (_) { /* app offline */ }
}

// ---------------------------------------------------------------- directory (collapsed by default)
function directoryTable(tds, open) {
  const el = document.createElement("details");
  el.className = "card wide";
  el.dataset.id = "directory";
  el.open = !!open;
  el.innerHTML = `<summary>Thing Directory (${tds.length} Thing Descriptions)</summary>
    <div class="meta" style="margin-top:6px">Raw JSON: <a href="/things">/things</a> · <a href="/.well-known/wot">directory TD</a></div>
    <div class="table-wrap"><table><thead><tr><th>id</th><th>title</th><th>protocols</th><th>expires</th></tr></thead><tbody>
    ${tds.map((t) => `<tr><td class="id">${esc(t.id)}</td><td>${esc(t.title)}</td><td>${esc(protocols(t).join(", "))}</td><td>${t.registration?.expires ? clock(t.registration.expires) : "–"}</td></tr>`).join("")}
    </tbody></table></div>`;
  return el;
}

async function load() {
  const tds = await (await fetch("/things")).json();
  const byId = Object.fromEntries(tds.map((t) => [t.id, t]));
  const proxies = tds.filter((t) => t.id.startsWith("urn:wot:gateway:urn:wot:device:"));
  const app = tds.find((t) => t.id.startsWith("urn:wot:app:"));
  const sims = tds.filter((t) => t.id.startsWith("urn:wot:sim:")).length;
  $("#summary").textContent = `${proxies.length} devices through the gateway · ${tds.length} Thing Descriptions registered${sims ? ` · ${sims} simulated` : ""}`;

  const signature = proxies.map((p) => p.id + protocols(byId[p.id.replace("urn:wot:gateway:", "")] || {}).join()).join() + (app ? app.id : "");
  const cards = $("#cards");
  const dirOpen = $('[data-id="directory"]', cards)?.open;
  if (signature !== state.built) {
    state.built = signature;
    cards.innerHTML = "";
    if (app) cards.append(appCard(app));
    for (const p of proxies) cards.append(deviceCard(p, byId[p.id.replace("urn:wot:gateway:", "")]));
    cards.append(directoryTable(tds, dirOpen));
  } else {
    $('[data-id="directory"]', cards)?.replaceWith(directoryTable(tds, dirOpen));
  }
  if (app) refreshApp(app, $(`[data-id="${CSS.escape(app.id)}"]`, cards));
  for (const p of proxies) refreshCard(p, $(`[data-id="${CSS.escape(p.id)}"]`, cards));
  $("#updated").textContent = `Updated ${clock(Date.now())}`;
}

load().catch(() => {});
setInterval(() => load().catch(() => { $("#updated").textContent = "Directory unreachable"; }), 2000);
</script>
</body>
</html>
